name: Check Upstream Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # 每週一 09:00 UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: withFly

      - name: Add upstream remote
        run: git remote add upstream https://github.com/NanasuNANA/UdonariumWithFly.git

      - name: Fetch upstream
        run: git fetch upstream withFly

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/withFly)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -gt 0 ]; then
            LATEST=$(git log upstream/withFly -1 --pretty=format:"%h %s (%ar)")
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if behind
        if: steps.check.outputs.behind > 0
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.check.outputs.behind }}';
            const latest = '${{ steps.check.outputs.latest }}';

            // 檢查是否已有相同標題的 open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-update',
            });

            if (issues.data.length > 0) {
              console.log('Upstream update issue already exists, skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[上游更新] upstream 有 ${behind} 個新 commit 待合入`,
              body: [
                '## 上游 (NanasuNANA/UdonariumWithFly) 有新更新',
                '',
                `- **落後 commit 數**：${behind}`,
                `- **最新 commit**：${latest}`,
                '',
                '## 合入步驟',
                '```bash',
                'git fetch upstream',
                'git checkout withFly',
                'git merge upstream/withFly',
                'git push origin withFly',
                '',
                '# 接著將翻譯 branch rebase 到最新',
                'git checkout zh-TW',
                'git rebase withFly',
                '# 解決衝突（主要是新增的日文字串需補翻譯）',
                'git push origin zh-TW --force-with-lease',
                '```',
              ].join('\n'),
              labels: ['upstream-update'],
            });
