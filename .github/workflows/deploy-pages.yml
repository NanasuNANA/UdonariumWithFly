name: Deploy to GitHub Pages

on:
  push:
    branches:
      - zh-TW
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create config.yaml
        run: |
          cat > src/assets/config.yaml << EOF
          backend:
            mode: trystero
          trystero:
            firebase:
              apiKey: ${{ secrets.FIREBASE_API_KEY }}
              databaseURL: ${{ secrets.FIREBASE_DATABASE_URL }}
              projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
              appId: ${{ secrets.FIREBASE_APP_ID }}
          EOF

      - name: Build
        run: npm run build -- --base-href /

      - name: Push to Double-Plus-Studio.github.io
        run: |
          touch dist/udonarium/.nojekyll
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/Double-Plus-Studio/Double-Plus-Studio.github.io.git pages-repo
          cp -r dist/udonarium/. pages-repo/
          cd pages-repo
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from UdonariumWithFly@${{ github.sha }}"
          git push
