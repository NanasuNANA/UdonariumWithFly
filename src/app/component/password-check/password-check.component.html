<form #passwordForm="ngForm">
  <div>密碼: <input #input [(ngModel)]="password" (input)="onInputChange(input.value)" (keypress.enter)="submit()" [ngModelOptions]="{standalone: true}" placeholder="密碼" #passwordInput /></div>
  <button type="submit" (click)="submit()"><b>入室</b></button>
</form>
<div>
  <span style="font-size: 12px;">{{help}}</span>
</div>
