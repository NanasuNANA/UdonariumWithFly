<div class="flex-container" style="flex-wrap: nowrap">
    <div class="flex-item no-grow">
      <select #select style="width: 140px" size="10" multiple (change)="onChangeSelectTabs()" [disabled]="isAllTabs">
        <option *ngFor="let chatTab of chatTabs" value="{{chatTab.identifier}}">{{chatTab.name}}</option>
      </select>
    </div>
    <div class="flex-item">
      <ng-container *ngIf="!isEmpty">
        <div style="font-weight: bolder; font-size: smaller; padding-top: 3px">
          <div>
            分頁：
            <label><input name="{{panelId}}-log-output-tab" type="radio" [(ngModel)]="isAllTabs" [checked]="!isAllTabs" [value]="false">所選分頁</label>
            <label><input name="{{panelId}}-log-output-tab" type="radio" [(ngModel)]="isAllTabs" [checked]="isAllTabs" [value]="true">全部分頁</label>
          </div>
          <div>
            形式：
            <label><input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [checked]="logFormat == 0" [value]="0">文字</label>
            <label><input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [checked]="logFormat == 1" [value]="1">HTML</label>
            <label><input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [checked]="logFormat == 2" [value]="2">HTML (含圖片)</label>
            <div style="font-weight: normal; padding-left: 1em">※<b>HTML（含圖片）</b> 將輸出為ZIP檔案，<br>　請保留資料夾結構解壓縮。</div>
          </div>
          <div>
            時刻：
            <label><input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [checked]="dateFormat == ''" [value]="''">無</label>
            <label><input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [checked]="dateFormat == 'HH:mm'" [value]="'HH:mm'">時：分</label>
            <label><input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [checked]="dateFormat == 'yyyy/MM/dd HH:mm'" [value]="'yyyy/MM/dd HH:mm'">日期時刻</label>
          </div>
        </div>
        <hr/>
        <div style="width: 100%; display: flex">
          <div>
            <label style="font-weight: bolder; font-size: smaller; padding-top: 3px; padding-right: 1em">
              <input type="checkbox" [(ngModel)]="isWriteOerationLog" checked="{{isWriteOerationLog ? 'checked' : ''}}" />包含操作日誌
            </label>
          </div>
          <div style="flex-grow: 1; text-align: right">
            <button (click)="logFormat < 2 ? saveLog() : saveLogWithImages()" style="font-size: smaller" [disabled]="isDisable">
              <div style="position: relative;">
                <div [ngClass]="{'is-hidden': isSaveing}">輸出日誌</div>
                <div *ngIf="isSaveing" class="progress">{{progresPercent}}%</div>
              </div>
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
  <ng-container *ngIf="isEmpty">
    <div style="font-size: 12px;">※尚未建立任何聊天分頁。</div>
  </ng-container>
