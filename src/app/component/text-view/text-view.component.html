@if (!isObj(text)) {
  <span><pre class="text">{{text}}</pre></span>
}
@if (isObj(text)) {
  <span>@for (t of text; track t; let l = $last) {
    <pre class="text"><span #message
    [innerHTML]="textShadwing(htmlEscapeLinking(t)) | safe: 'html'" (click)="onLinkClick($event)"></span>@if (!l) {
    <hr>
    }</pre>
  }</span>
}
